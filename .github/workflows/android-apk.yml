
name: Build TaraCommute Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: stable
          cache: true

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          verify-signature: true

      - name: Check Flutter setup
        run: flutter --version

      - name: Generate Android project files if missing
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.bueraglobal.taracommute .
          fi

      - name: Configure TaraCommute authentication deep link
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          manifest_path = Path("android/app/src/main/AndroidManifest.xml")
          android_ns = "http://schemas.android.com/apk/res/android"

          if not manifest_path.exists():
              raise SystemExit("AndroidManifest.xml was not found.")

          ET.register_namespace("android", android_ns)

          tree = ET.parse(manifest_path)
          root = tree.getroot()

          activity = root.find("./application/activity")

          if activity is None:
              raise SystemExit("Main Android activity was not found.")

          scheme_key = f"{{{android_ns}}}scheme"
          host_key = f"{{{android_ns}}}host"
          name_key = f"{{{android_ns}}}name"

          already_configured = False

          for intent_filter in activity.findall("intent-filter"):
              for data in intent_filter.findall("data"):
                  if (
                      data.get(scheme_key) == "com.bueraglobal.taracommute"
                      and data.get(host_key) == "login-callback"
                  ):
                      already_configured = True
                      break
              if already_configured:
                  break

          if not already_configured:
              intent_filter = ET.SubElement(activity, "intent-filter")

              ET.SubElement(
                  intent_filter,
                  "action",
                  {name_key: "android.intent.action.VIEW"},
              )

              ET.SubElement(
                  intent_filter,
                  "category",
                  {name_key: "android.intent.category.DEFAULT"},
              )

              ET.SubElement(
                  intent_filter,
                  "category",
                  {name_key: "android.intent.category.BROWSABLE"},
              )

              ET.SubElement(
                  intent_filter,
                  "data",
                  {
                      scheme_key: "com.bueraglobal.taracommute",
                      host_key: "login-callback",
                  },
              )

          tree.write(
              manifest_path,
              encoding="utf-8",
              xml_declaration=True,
          )

          print("TaraCommute authentication deep link configured.")
          PY

      - name: Upload Android configuration for inspection
        uses: actions/upload-artifact@v4
        with:
          name: tara-commute-android-config
          path: android/
          if-no-files-found: error
          retention-days: 7

      - name: Get packages
        run: flutter pub get

      - name: Check code
        run: flutter analyze lib

      - name: Build debug APK
        run: >
          flutter build apk --debug
          --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          --dart-define=SUPABASE_PUBLISHABLE_KEY=${{ secrets.SUPABASE_PUBLISHABLE_KEY }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tara-commute-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
